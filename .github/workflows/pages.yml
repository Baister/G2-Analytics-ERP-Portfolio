name: Demonstração ao vivo

# Publica o site estático no GitHub Pages. O retrato de dados é REGERADO a cada
# publicação, então a demonstração nunca aparece congelada no tempo: a janela
# do dataset é sempre relativa à data do deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências da API
        run: pip install -r api/requirements.txt

      - name: Gerar dataset e exportar o retrato
        working-directory: api
        run: |
          python -m dados.gerar --forcar
          python -m dados.exportar_demo

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências do front
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build estático
        working-directory: web
        env:
          VITE_DEMO: "1"
          # O Pages serve em /<nome-do-repositório>/ — sem isso os assets 404.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.output/public
      - id: deploy
        uses: actions/deploy-pages@v4
