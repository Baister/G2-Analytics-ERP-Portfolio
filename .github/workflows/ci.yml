name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: pip install -r api/requirements.txt
      - name: Gerar o banco sintético
        working-directory: api
        run: python -m dados.gerar
      - name: Testes
        working-directory: api
        # A suíte não abre conexão com banco externo: o dataset é gerado aqui.
        run: python -m pytest tests/ -q

  web:
    name: Front — tipagem e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # O TanStack Start exige Node >= 22.12 — em Node 20 o npm ci falha
          # antes mesmo de instalar.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        working-directory: web
        # `npm install` em vez de `npm ci`: o projeto usa uma versão beta do
        # nitro e binários nativos por plataforma, combinação em que o `ci`
        # (que exige correspondência exata com o lock) se recusa a instalar no
        # runner. O lock continua versionado e é respeitado quando dá.
        run: npm install --no-audit --no-fund
      - name: Checagem de tipos
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
